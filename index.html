<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logos Network</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #181c24;
    color: #e5e7eb;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 10px 20px;
    background: #181c24;
    border-bottom: 1px solid #252b38;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  #header h1 {
    font-size: 15px;
    font-weight: 600;
    color: #f0f0f0;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .stat-label { color: #6b7280; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-value { color: #e5e7eb; font-size: 13px; font-weight: 500; }

  #mode-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .mode-online  { background: #14532d; color: #22c55e; }
  .mode-syncing { background: #78350f; color: #f59e0b; }
  .mode-offline { background: #450a0a; color: #ef4444; }

  #spacer { flex: 1; }

  #updated-label {
    color: #4b5563;
    font-size: 11px;
    white-space: nowrap;
  }

  #refresh-btn, #feed-btn {
    background: #252b38;
    border: 1px solid #2e3747;
    color: #9ca3af;
    border-radius: 4px;
    padding: 4px 10px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  #refresh-btn:hover, #feed-btn:hover { background: #2e3747; color: #e5e7eb; }
  #feed-btn.active { color: #e879f9; border-color: #e879f9; }

  /* ── Main area: map + sidebar ── */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── Map ── */
  #map-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  #map {
    width: 100%;
    height: 100%;
    background: #181c24;
  }

  /* ── Popup ── */
  .leaflet-popup-content-wrapper {
    background: #1e2330;
    border: 1px solid #2e3747;
    border-radius: 6px;
    color: #e5e7eb;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .leaflet-popup-tip { background: #1e2330; }
  .leaflet-popup-content { margin: 12px 14px; min-width: 220px; }

  .popup-peer-id {
    font-size: 10px;
    color: #6b7280;
    word-break: break-all;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .popup-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 3px 0;
    border-bottom: 1px solid #252b38;
  }
  .popup-row:last-child { border-bottom: none; }
  .popup-key { color: #6b7280; }
  .popup-val { color: #e5e7eb; text-align: right; }

  /* ── Marker pulse ── */
  .node-marker {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #38bdf8;
    border: 2px solid #0ea5e9;
    position: relative;
  }
  .node-marker::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: rgba(56,189,248,0.25);
    animation: pulse 2.5s ease-out infinite;
  }
  .node-marker.offline {
    background: #374151;
    border: 2px solid #4b5563;
  }
  .node-marker.offline::after { display: none; }
  .node-marker.self {
    width: 16px;
    height: 16px;
    background: #f59e0b;
    border: 2px solid #d97706;
  }
  .node-marker.self::after {
    background: rgba(245,158,11,0.3);
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(0.8); opacity: 0.6; }
    70%  { transform: scale(1.6); opacity: 0; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* ── Node count overlay ── */
  #node-count {
    position: absolute;
    bottom: 24px;
    left: 16px;
    z-index: 1000;
    background: rgba(24,28,36,0.92);
    border: 1px solid #252b38;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    color: #9ca3af;
    pointer-events: none;
  }
  #node-count strong { color: #38bdf8; font-size: 20px; margin-right: 6px; }

  /* ── Event (circle) markers ── */
  .event-marker {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    position: relative;
  }
  .event-marker.upcoming {
    background: #e879f9;
    border: 2px solid #d946ef;
    box-shadow: 0 0 8px rgba(232,121,249,0.6);
  }
  .event-marker.upcoming::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: rgba(232,121,249,0.2);
    animation: pulse 2s ease-out infinite;
  }
  .event-marker.past {
    background: #86198f44;
    border: 2px solid #86198f88;
  }

  /* ── Loading overlay ── */
  #loading {
    position: absolute;
    inset: 0;
    z-index: 2000;
    background: rgba(24,28,36,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #6b7280;
    letter-spacing: 0.05em;
  }
  #loading.hidden { display: none; }

  /* ── Feed sidebar ── */
  #sidebar {
    width: 300px;
    flex-shrink: 0;
    background: #181c24;
    border-left: 1px solid #252b38;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.2s ease;
  }
  #sidebar.hidden {
    width: 0;
    border-left: none;
  }

  #sidebar-tabs {
    display: flex;
    border-bottom: 1px solid #252b38;
    flex-shrink: 0;
  }
  .stab {
    flex: 1;
    padding: 9px 0;
    background: none;
    border: none;
    color: #6b7280;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .stab:hover { color: #e5e7eb; }
  .stab.active { color: #e5e7eb; border-bottom-color: #38bdf8; }
  .stab.active.circles-tab { border-bottom-color: #e879f9; }

  #sidebar-body {
    flex: 1;
    overflow-y: auto;
  }
  #sidebar-body::-webkit-scrollbar { width: 4px; }
  #sidebar-body::-webkit-scrollbar-track { background: transparent; }
  #sidebar-body::-webkit-scrollbar-thumb { background: #252b38; border-radius: 2px; }

  .feed-item {
    padding: 12px 14px;
    border-bottom: 1px solid #1e2330;
  }
  .feed-item:hover { background: #1e2330; cursor: pointer; }

  .feed-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .feed-repo {
    font-size: 10px;
    color: #38bdf8;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 170px;
  }
  .feed-repo.community { color: #e879f9; }
  .feed-time {
    font-size: 10px;
    color: #4b5563;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .feed-title {
    font-size: 12px;
    color: #d1d5db;
    line-height: 1.4;
    word-break: break-word;
  }
  .feed-type {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 1px 5px;
    border-radius: 3px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .type-push    { background: #1e3a5f; color: #60a5fa; }
  .type-pr      { background: #1e3a2a; color: #4ade80; }
  .type-release { background: #3a1e1e; color: #f87171; }
  .type-create  { background: #2a1e3a; color: #c084fc; }
  .type-topic   { background: #3a1e2e; color: #e879f9; }

  .feed-empty {
    padding: 24px 14px;
    color: #4b5563;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Logos Network</h1>

  <div class="stat">
    <span class="stat-label">Status</span>
    <span id="mode-badge" class="stat-value mode-offline">—</span>
  </div>
  <div class="stat">
    <span class="stat-label">Slot</span>
    <span class="stat-value" id="stat-slot">—</span>
  </div>
  <div class="stat">
    <span class="stat-label">Height</span>
    <span class="stat-value" id="stat-height">—</span>
  </div>
  <div class="stat">
    <span class="stat-label">LIB Slot</span>
    <span class="stat-value" id="stat-lib">—</span>
  </div>
  <div class="stat">
    <span class="stat-label">Connected Peers</span>
    <span class="stat-value" id="stat-peers">—</span>
  </div>
  <div class="stat">
    <span class="stat-label">Circles</span>
    <span class="stat-value" id="stat-events">—</span>
  </div>

  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#9ca3af;font-size:12px;white-space:nowrap;">
    <input type="checkbox" id="toggle-events" checked style="accent-color:#e879f9;"> Circles
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#9ca3af;font-size:12px;white-space:nowrap;">
    <input type="checkbox" id="toggle-nodes" checked style="accent-color:#38bdf8;"> Nodes
  </label>

  <div id="spacer"></div>

  <span id="updated-label">—</span>
  <button id="refresh-btn" onclick="refresh()">Refresh</button>
  <button id="feed-btn" class="active" onclick="toggleSidebar()">Feed</button>
</div>

<div id="main">
  <div id="map-wrap">
    <div id="map"></div>
    <div id="node-count"><strong id="node-count-num">—</strong>online / total</div>
    <div id="loading">Loading network data...</div>
  </div>

  <div id="sidebar">
    <div id="sidebar-tabs">
      <button class="stab active" data-tab="dev" onclick="switchTab('dev')">Dev</button>
      <button class="stab circles-tab" data-tab="community" onclick="switchTab('community')">Community</button>
    </div>
    <div id="sidebar-body">
      <div class="feed-empty">Loading…</div>
    </div>
  </div>
</div>

<script>
// ── Map init ──────────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [20, 10],
  zoom: 2,
  minZoom: 2,
  zoomControl: true,
  attributionControl: true,
  worldCopyJump: false,
  maxBounds: [[-85, -180], [85, 180]],
  maxBoundsViscosity: 1.0,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 18,
  noWrap: true,
}).addTo(map);

// ── State ─────────────────────────────────────────────────────────────────────
let markers = [];
let eventMarkers = [];

function clearMarkers() {
  markers.forEach(m => m.remove());
  markers = [];
  eventMarkers.forEach(m => m.remove());
  eventMarkers = [];
}

function makeIcon(isSelf, online) {
  let cls = 'node-marker';
  if (isSelf)        cls += ' self';
  else if (!online)  cls += ' offline';
  const size = isSelf ? 16 : 12;
  return L.divIcon({ className: '', html: `<div class="${cls}"></div>`, iconSize: [size,size], iconAnchor: [size/2,size/2] });
}

function fmtTs(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
}

function fmt(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString();
}

function timeSince(ts) {
  const s = Math.round(Date.now()/1000 - ts);
  if (s < 60)    return `${s}s ago`;
  if (s < 3600)  return `${Math.round(s/60)}m ago`;
  if (s < 86400) return `${Math.round(s/3600)}h ago`;
  return `${Math.round(s/86400)}d ago`;
}

function timeSinceISO(iso) {
  return timeSince(new Date(iso).getTime() / 1000);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(data) {
  const chain = data.chain || {};
  const net   = data.network || {};

  const mode = chain.mode || 'Offline';
  const badge = document.getElementById('mode-badge');
  badge.textContent = mode;
  badge.className = '';
  if (mode === 'Online')       badge.className = 'stat-value mode-online';
  else if (mode === 'Offline') badge.className = 'stat-value mode-offline';
  else                         badge.className = 'stat-value mode-syncing';

  document.getElementById('stat-slot').textContent   = fmt(chain.slot);
  document.getElementById('stat-height').textContent = fmt(chain.height);
  document.getElementById('stat-lib').textContent    = fmt(chain.lib_slot);
  document.getElementById('stat-peers').textContent  = fmt(net.n_peers);
  document.getElementById('updated-label').textContent = 'Updated ' + timeSince(data.updated);

  const onlineCount = data.nodes.filter(n => n.self || n.online !== false).length;
  const totalCount  = data.nodes.length;
  document.getElementById('node-count-num').textContent = `${onlineCount} / ${totalCount}`;

  clearMarkers();

  const showEvents = document.getElementById('toggle-events').checked;
  const events = data.events || [];
  const upcomingCount = events.filter(e => e.upcoming).length;
  document.getElementById('stat-events').textContent =
    `${upcomingCount} upcoming / ${events.length} total`;

  for (const ev of events) {
    const cls = ev.upcoming ? 'event-marker upcoming' : 'event-marker past';
    const icon = L.divIcon({
      className: '',
      html: `<div class="${cls}"></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7],
    });
    const m = L.marker([ev.lat, ev.lon], {
      icon,
      zIndexOffset: ev.upcoming ? 500 : -50,
      opacity: showEvents ? 1 : 0,
    });
    const date = ev.start ? ev.start.slice(0, 10) : '—';
    const location = [ev.city, ev.country].filter(Boolean).join(', ') || '—';
    m.bindPopup(`
      <div style="color:#e879f9;font-weight:600;margin-bottom:6px;">
        ● ${ev.upcoming ? 'Upcoming Circle' : 'Past Circle'}
      </div>
      <div style="font-weight:600;margin-bottom:8px;color:#f0f0f0;">${ev.name}</div>
      <div class="popup-row"><span class="popup-key">Date</span><span class="popup-val">${date}</span></div>
      <div class="popup-row"><span class="popup-key">Location</span><span class="popup-val">${location}</span></div>
      <div class="popup-row"><span class="popup-key">Address</span><span class="popup-val" style="max-width:160px;word-break:break-word;">${ev.address || '—'}</span></div>
      <div style="margin-top:8px;">
        <a href="${ev.url}" target="_blank" style="color:#e879f9;font-size:12px;">View on lu.ma →</a>
      </div>
    `);
    if (showEvents) m.addTo(map);
    eventMarkers.push(m);
  }

  const showNodes = document.getElementById('toggle-nodes').checked;
  for (const node of data.nodes) {
    const online = node.self || node.online !== false;
    const m = L.marker([node.lat, node.lon], {
      icon: makeIcon(node.self, online),
      zIndexOffset: node.self ? 1000 : (online ? 0 : -100),
      opacity: online ? 1 : 0.6,
    });

    const shortPeer = node.peer_id.slice(0, 16) + '…' + node.peer_id.slice(-8);
    const location  = [node.city, node.country].filter(Boolean).join(', ') || 'Unknown';
    const selfLabel   = node.self   ? '<div style="color:#f59e0b;font-weight:600;margin-bottom:6px;">⬡ This node</div>' : '';
    const statusLabel = !node.self  ? `<div style="color:${online ? '#22c55e' : '#6b7280'};font-size:11px;font-weight:600;margin-bottom:6px;">${online ? '● Online' : '● Offline'}</div>` : '';

    m.bindPopup(`
      ${selfLabel}${statusLabel}
      <div class="popup-peer-id" title="${node.peer_id}">${shortPeer}</div>
      <div class="popup-row"><span class="popup-key">IP</span><span class="popup-val">${node.ip}</span></div>
      <div class="popup-row"><span class="popup-key">Location</span><span class="popup-val">${location}</span></div>
      <div class="popup-row"><span class="popup-key">ISP</span><span class="popup-val">${node.isp || '—'}</span></div>
      <div class="popup-row"><span class="popup-key">Org</span><span class="popup-val">${node.org || '—'}</span></div>
      <div class="popup-row"><span class="popup-key">ASN</span><span class="popup-val">${node.asn || '—'}</span></div>
      ${node.first_seen ? `<div class="popup-row"><span class="popup-key">First seen</span><span class="popup-val">${fmtTs(node.first_seen)}</span></div>` : ''}
      ${node.last_seen  ? `<div class="popup-row"><span class="popup-key">Last seen</span><span class="popup-val">${fmtTs(node.last_seen)}</span></div>` : ''}
    `);

    if (showNodes) m.addTo(map);
    markers.push(m);
  }
}

// ── Network data fetch ────────────────────────────────────────────────────────
let firstLoad = true;

async function refresh() {
  document.getElementById('loading').classList.remove('hidden');
  try {
    const resp = await fetch('./network.json');
    if (!resp.ok) throw new Error(resp.statusText);
    const data = await resp.json();
    render(data);
    if (firstLoad) {
      firstLoad = false;
      const pts = [
        ...data.nodes.map(n => [n.lat, n.lon]),
        ...(data.events || []).filter(e => e.upcoming).map(e => [e.lat, e.lon]),
      ];
      if (pts.length > 0) {
        map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 6 });
      }
    }
  } catch (e) {
    document.getElementById('updated-label').textContent = 'Error: ' + e.message;
  } finally {
    document.getElementById('loading').classList.add('hidden');
  }
}

document.getElementById('toggle-events').addEventListener('change', e => {
  eventMarkers.forEach(m => e.target.checked ? m.addTo(map) : m.remove());
});
document.getElementById('toggle-nodes').addEventListener('change', e => {
  markers.forEach(m => e.target.checked ? m.addTo(map) : m.remove());
});

refresh();
setInterval(refresh, 30_000);
setTimeout(() => map.invalidateSize(), 100);

// ── Sidebar ───────────────────────────────────────────────────────────────────
let activeTab = 'dev';
let ghItems = [];
let communityItems = [];

function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const btn = document.getElementById('feed-btn');
  const hidden = sb.classList.toggle('hidden');
  btn.classList.toggle('active', !hidden);
  setTimeout(() => map.invalidateSize(), 220);
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.stab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderFeed();
}

function renderFeed() {
  const body  = document.getElementById('sidebar-body');
  const items = activeTab === 'dev' ? ghItems : communityItems;
  if (!items.length) {
    body.innerHTML = '<div class="feed-empty">Loading…</div>';
    return;
  }
  if (activeTab === 'dev') {
    body.innerHTML = items.map(item => `
      <div class="feed-item" onclick="window.open('${item.url}','_blank')">
        <div class="feed-meta">
          <span class="feed-repo">${item.repo}</span>
          <span class="feed-time">${item.ago}</span>
        </div>
        <span class="feed-type ${item.typeClass}">${item.typeLabel}</span>
        <div class="feed-title">${item.title}</div>
      </div>`).join('');
  } else {
    body.innerHTML = items.map(item => `
      <div class="feed-item" onclick="window.open('${item.url}','_blank')">
        <div class="feed-meta">
          <span class="feed-repo community">${item.category}</span>
          <span class="feed-time">${item.ago}</span>
        </div>
        <span class="feed-type type-topic">Forum</span>
        <div class="feed-title">${item.title}</div>
      </div>`).join('');
  }
}

// GitHub events
const GH_TYPE_MAP = {
  PushEvent:              { label: 'Push',    cls: 'type-push'   },
  PullRequestEvent:       { label: 'PR',      cls: 'type-pr'     },
  CreateEvent:            { label: 'Create',  cls: 'type-create' },
  ReleaseEvent:           { label: 'Release', cls: 'type-release'},
  IssueCommentEvent:      { label: 'Comment', cls: 'type-create' },
  PullRequestReviewEvent: { label: 'Review',  cls: 'type-pr'     },
};

async function loadGitHub() {
  try {
    const resp = await fetch('https://api.github.com/orgs/logos-co/events?per_page=50');
    if (!resp.ok) return;
    const events = await resp.json();
    const seen = new Set();
    ghItems = [];
    for (const e of events) {
      const map_ = GH_TYPE_MAP[e.type];
      if (!map_) continue;
      const repo = (e.repo?.name || '').replace('logos-co/', '');
      const p = e.payload || {};
      let title = '';
      let url = `https://github.com/${e.repo?.name || 'logos-co'}`;
      if (e.type === 'PushEvent') {
        const commits = p.commits || [];
        title = commits[0]?.message?.split('\n')[0] || '';
        url = `https://github.com/${e.repo?.name}/commit/${commits[0]?.sha || ''}`;
      } else if (e.type === 'PullRequestEvent') {
        title = p.pull_request?.title || '';
        url = p.pull_request?.html_url || url;
      } else if (e.type === 'CreateEvent') {
        title = `new ${p.ref_type} "${p.ref || ''}"`;
      } else if (e.type === 'ReleaseEvent') {
        title = p.release?.name || p.release?.tag_name || '';
        url = p.release?.html_url || url;
      } else if (e.type === 'IssueCommentEvent') {
        title = p.issue?.title || '';
        url = p.comment?.html_url || url;
      } else if (e.type === 'PullRequestReviewEvent') {
        title = p.pull_request?.title || '';
        url = p.pull_request?.html_url || url;
      }
      const key = `${e.type}:${repo}:${title}`;
      if (!title || seen.has(key)) continue;
      seen.add(key);
      ghItems.push({ repo, typeLabel: map_.label, typeClass: map_.cls, title, ago: timeSinceISO(e.created_at), url });
      if (ghItems.length >= 25) break;
    }
    if (activeTab === 'dev') renderFeed();
  } catch (_) {}
}

// Discourse forum
const CATEGORY_NAME = { 4: 'Circles', 6: 'Circles', 8: 'Announcements', 1: 'General' };

async function loadDiscourse() {
  try {
    const resp = await fetch('https://forum.logos.co/latest.json?limit=30');
    if (!resp.ok) return;
    const data = await resp.json();
    communityItems = (data.topic_list?.topics || [])
      .filter(t => !t.pinned)
      .slice(0, 20)
      .map(t => ({
        title:    t.title,
        category: CATEGORY_NAME[t.category_id] || 'Forum',
        url:      `https://forum.logos.co/t/${t.slug}/${t.id}`,
        ago:      timeSinceISO(t.created_at),
      }));
    if (activeTab === 'community') renderFeed();
  } catch (_) {}
}

loadGitHub();
loadDiscourse();
setInterval(loadGitHub,    5 * 60_000);
setInterval(loadDiscourse, 5 * 60_000);
</script>
