[package]
name = "zone-scanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zone-scanner"
path = "src/main.rs"

[dependencies]
tokio      = { version = "1", features = ["full"] }
# rustls (not the default native-tls/openssl) so the scanner builds without
# system OpenSSL dev headers — it only talks HTTP to a local node anyway.
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
futures-util = "0.3.32"
hex = "0.4.3"
