[package]
name = "zone-scanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zone-scanner"
path = "src/main.rs"

[dependencies]
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", features = ["json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
futures-util = "0.3.32"
hex = "0.4.3"
